<!doctype html>
<html lang="en" data-theme="xcode-dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- Pre-paint theme: read localStorage then prefers-color-scheme to set
		     data-theme before any CSS evaluates. Eliminates the dark→light flash
		     for users who prefer light. -->
		<script>
			(function () {
				try {
					var v = localStorage.getItem('mostafa.theme');
					var t =
						v === 'light' || v === 'dark'
							? v
							: window.matchMedia &&
								window.matchMedia('(prefers-color-scheme: light)').matches
								? 'light'
								: 'dark';
					document.documentElement.setAttribute(
						'data-theme',
						t === 'light' ? 'xcode-light' : 'xcode-dark'
					);
				} catch (e) {}
			})();
		</script>

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#5896d6" />

		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#1F1F24" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />

		<meta property="og:site_name" content="Mostafa.xcodeproj" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://mostafa3la2.github.io/og.svg" />
		<meta property="og:image:type" content="image/svg+xml" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://mostafa3la2.github.io/og.svg" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
